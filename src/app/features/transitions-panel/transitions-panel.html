<p class="hint">Arrastrá una transición al borde de un clip en la timeline. Sobre un corte entre dos clips hace un cruce; en un borde libre, una entrada o salida.</p>

<div class="grid">
  @for (t of types; track t; let i = $index) {
    <div
      class="card"
      draggable="true"
      (dragstart)="onDragStart($event, t)"
      (dragend)="onDragEnd()"
      (mouseenter)="onEnter(i, t)"
      (mouseleave)="onLeave(i, t)"
      [title]="labels[t]"
    >
      <canvas #thumb class="thumb" width="192" height="108"></canvas>
      <div class="name">{{ labels[t] }}</div>
    </div>
  }
</div>

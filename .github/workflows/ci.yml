# Verificación rápida en cada pull request: tipos + build. (Los push a dev/test/production ya
# compilan y publican desde release.yml.)
name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

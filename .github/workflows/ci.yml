# Verificación rápida en cada push a `dev` y en cada pull request: tipos + build. No publica nada.
name: CI

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

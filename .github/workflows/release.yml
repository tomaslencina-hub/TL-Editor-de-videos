# Publica un instalador de Windows en GitHub Releases al subir a `test` o `production`.
# La app instalada se actualiza sola desde esas releases (electron-updater):
#   - production → versión estable  X.Y.N       → la reciben todos los usuarios
#   - test       → versión beta     X.Y.N-beta  → la reciben solo quienes tienen instalada una beta
# N es el número de ejecución de este workflow: siempre crece, así cada publicación es más nueva que la anterior.
name: Release

on:
  push:
    branches: [test, production]

permissions:
  contents: write # crear releases y subir el instalador

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular versión
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          if [ "${{ github.ref_name }}" = "test" ]; then
            VERSION="$VERSION-beta"
          fi
          npm version --no-git-tag-version "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versión: $VERSION"

      - name: Descargar FFmpeg full (incluye Whisper para subtítulos; va dentro del instalador)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $root = $bin.Directory.Parent.FullName
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item "$($bin.Directory.FullName)/ffmpeg.exe", "$($bin.Directory.FullName)/ffprobe.exe" vendor/ffmpeg/
          Copy-Item "$root/LICENSE" vendor/ffmpeg/LICENSE-ffmpeg.txt -ErrorAction SilentlyContinue
          & vendor/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          # Los subtítulos automáticos necesitan el filtro whisper: si falta, se corta la publicación.
          $filters = & vendor/ffmpeg/ffmpeg.exe -hide_banner -filters
          if (-not ($filters -match ' whisper ')) { Write-Error 'El FFmpeg descargado no incluye el filtro whisper'; exit 1 }

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      # electron-builder solo genera los archivos; la subida la hace gh (sube todo y recién después publica).
      - name: Empaquetar
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win --publish never 2>&1 | tee builder.log; then
            grep -iE "⨯|error|failed" builder.log | tail -n 10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -la release
          for f in release/*.exe release/*.blockmap release/latest.yml; do
            [ -f "$f" ] && echo "::notice::Generado $(basename "$f") ($(( $(stat -c %s "$f") / 1048576 )) MB)"
          done
          true

      - name: Publicar la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # La app busca "<canal>.yml": las betas leen beta.yml y las estables latest.yml.
          # Se suben los dos (mismo contenido) para que una beta también pueda pasar a una estable.
          cp release/latest.yml release/beta.yml
          shopt -s nullglob
          FILES=(release/*.exe release/*.blockmap release/latest.yml release/beta.yml)
          if [ "${{ github.ref_name }}" = "test" ]; then FLAGS="--prerelease --latest=false"; else FLAGS="--latest"; fi
          # shellcheck disable=SC2086
          gh release create "v$VERSION" "${FILES[@]}" --target "$GITHUB_SHA" --title "SHOTON $VERSION" \
            --notes "Versión $VERSION publicada desde la rama ${{ github.ref_name }} (${GITHUB_SHA::7})." $FLAGS
          gh release view "v$VERSION" --json tagName,isPrerelease,assets \
            --jq '"Publicada \(.tagName) (prerelease=\(.isPrerelease)) con: \([.assets[].name] | join(", "))"' |
            while IFS= read -r line; do echo "::notice::$line"; done

      # Releases sin archivo de actualización (.yml) son intentos fallidos: confunden al actualizador.
      - name: Limpiar releases incompletas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name != \"v$VERSION\") | select([.assets[].name | endswith(\".yml\")] | any | not) | .tag_name" |
          while IFS= read -r tag; do
            echo "::notice::Borrando release incompleta $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

# Publica un instalador de Windows en GitHub Releases al subir a `test` o `production`.
# La app instalada se actualiza sola desde esas releases (electron-updater):
#   - production → versión estable  X.Y.N       → la reciben todos los usuarios
#   - test       → versión beta     X.Y.N-beta  → la reciben solo quienes tienen instalada una beta
# N es el número de ejecución de este workflow: siempre crece, así cada publicación es más nueva que la anterior.
name: Release

on:
  push:
    branches: [test, production]

permissions:
  contents: write # crear releases y subir el instalador

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular versión
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          if [ "${{ github.ref_name }}" = "test" ]; then
            VERSION="$VERSION-beta"
          fi
          npm version --no-git-tag-version "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versión: $VERSION"

      - name: Descargar FFmpeg (se incluye en el instalador)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $root = $bin.Directory.Parent.FullName
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item "$($bin.Directory.FullName)/ffmpeg.exe", "$($bin.Directory.FullName)/ffprobe.exe" vendor/ffmpeg/
          Copy-Item "$root/LICENSE" vendor/ffmpeg/LICENSE-ffmpeg.txt -ErrorAction SilentlyContinue
          & vendor/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      # electron-builder sube todo a una release en BORRADOR (GitHub no deja agregar archivos a una
      # release que se crea ya publicada con un tag nuevo); el paso siguiente la publica.
      - name: Empaquetar y subir (borrador)
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win --publish always 2>&1 | tee builder.log; then
            # Muestra el error como anotación (visible en el resumen del workflow).
            grep -iE "⨯|error|failed|status|message" builder.log | tail -n 10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          # Con el token del workflow el listado incluye borradores.
          ID=$(gh api "repos/$REPO/releases?per_page=30" --jq ".[] | select(.tag_name == \"v$VERSION\") | .id" | head -n 1)
          if [ -z "$ID" ]; then
            echo "::error::No se encontró la release borrador v$VERSION"
            exit 1
          fi
          if [ "${{ github.ref_name }}" = "test" ]; then PRE=true; LATEST=false; else PRE=false; LATEST=true; fi
          gh api -X PATCH "repos/$REPO/releases/$ID" \
            -F draft=false -F prerelease=$PRE -f make_latest=$LATEST -f target_commitish="$GITHUB_SHA" \
            --jq '"Publicada \(.tag_name) (prerelease=\(.prerelease), draft=\(.draft)) con: \([.assets[].name] | join(", "))"' |
            while IFS= read -r line; do echo "::notice::$line"; done

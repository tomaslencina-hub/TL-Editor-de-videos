# Publica un instalador de Windows en GitHub Releases en cada push a dev, test o production.
# La app instalada se actualiza sola desde esas releases (electron-updater), cada una en su canal:
#   - dev        → "SHOTON Dev" X.Y.N-dev  (app aparte, se instala junto a la otra) → canal dev
#   - test       → "SHOTON"     X.Y.N-beta → canal beta
#   - production → "SHOTON"     X.Y.N      → canal estable (todos los usuarios)
# N es el número de ejecución de este workflow: siempre crece, así cada publicación es más nueva que la anterior.
name: Release

on:
  push:
    branches: [dev, test, production]

permissions:
  contents: write # crear releases y subir el instalador

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular versión y canal
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          case "${{ github.ref_name }}" in
            dev)  VERSION="$VERSION-dev";  CHANNEL=dev ;;
            test) VERSION="$VERSION-beta"; CHANNEL=beta ;;
            *)    CHANNEL=latest ;;
          esac
          npm version --no-git-tag-version "$VERSION"
          if [ "$CHANNEL" = "dev" ]; then
            # App separada: otro nombre, otro appId (se instala al lado) y otra carpeta de datos.
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.productName = 'SHOTON Dev';
              p.build.productName = 'SHOTON Dev';
              p.build.appId = 'com.shoton.editor.dev';
              p.build.nsis.shortcutName = 'SHOTON Dev';
              p.build.win.artifactName = 'SHOTON-Dev-Setup-\${version}.\${ext}';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
            "
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "Versión: $VERSION (canal $CHANNEL)"

      - name: Descargar FFmpeg full (incluye Whisper para subtítulos; va dentro del instalador)
        shell: pwsh
        run: |
          # El build "full" solo se publica en .7z (los runners de Windows traen 7-Zip).
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg-tmp -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error 'No se pudo descomprimir FFmpeg'; exit 1 }
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $root = $bin.Directory.Parent.FullName
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item "$($bin.Directory.FullName)/ffmpeg.exe", "$($bin.Directory.FullName)/ffprobe.exe" vendor/ffmpeg/
          Copy-Item "$root/LICENSE" vendor/ffmpeg/LICENSE-ffmpeg.txt -ErrorAction SilentlyContinue
          & vendor/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          # Los subtítulos automáticos necesitan el filtro whisper: si falta, se corta la publicación.
          $filters = & vendor/ffmpeg/ffmpeg.exe -hide_banner -filters
          if (-not ($filters -match ' whisper ')) { Write-Error 'El FFmpeg descargado no incluye el filtro whisper'; exit 1 }

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      # electron-builder solo genera los archivos; la subida la hace gh (sube todo y recién después publica).
      - name: Empaquetar
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --win --publish never 2>&1 | tee builder.log; then
            grep -iE "⨯|error|failed" builder.log | tail -n 10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          for f in release/*.exe release/*.blockmap release/latest.yml; do
            [ -f "$f" ] && echo "::notice::Generado $(basename "$f") ($(( $(stat -c %s "$f") / 1048576 )) MB)"
          done
          true

      - name: Publicar la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # La app busca "<canal>.yml" (dev.yml, beta.yml o latest.yml). electron-builder solo genera
          # latest.yml: se copia con el nombre del canal y se suben los dos.
          shopt -s nullglob
          FILES=(release/*.exe release/*.blockmap release/latest.yml)
          if [ "$CHANNEL" != "latest" ]; then
            cp release/latest.yml "release/$CHANNEL.yml"
            FILES+=("release/$CHANNEL.yml")
          fi
          if [ "$CHANNEL" = "latest" ]; then FLAGS="--latest"; else FLAGS="--prerelease --latest=false"; fi
          # shellcheck disable=SC2086
          gh release create "v$VERSION" "${FILES[@]}" --target "$GITHUB_SHA" --title "SHOTON $VERSION" \
            --notes "Versión $VERSION (canal $CHANNEL) publicada desde la rama ${{ github.ref_name }} (${GITHUB_SHA::7})." $FLAGS
          gh release view "v$VERSION" --json tagName,isPrerelease,assets \
            --jq '"Publicada \(.tagName) (prerelease=\(.isPrerelease)) con: \([.assets[].name] | join(", "))"' |
            while IFS= read -r line; do echo "::notice::$line"; done

      - name: Limpiar releases viejas o incompletas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          # Sin archivo de actualización (.yml) = intento fallido: confunde al actualizador.
          gh api "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name != \"v$VERSION\") | select([.assets[].name | endswith(\".yml\")] | any | not) | .tag_name" |
          while IFS= read -r tag; do
            echo "::notice::Borrando release incompleta $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
          # Las de dev se acumulan rápido: se conservan las 5 más nuevas.
          gh api "repos/$REPO/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | endswith("-dev"))] | sort_by(.created_at) | reverse | .[5:] | .[].tag_name' |
          while IFS= read -r tag; do
            echo "::notice::Borrando release dev vieja $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
